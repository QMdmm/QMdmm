name: CI

on:
  push:
    # 0.0.z is the release-testing line and is deliberately left out: its
    # builds are exercised by the packaging CI's release workflow instead.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Source is pure ASCII
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: QMdmm

      - name: Set timezone (Linux)
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          date

      - name: Check non-ASCII characters
        run: |
          if LC_ALL=C grep -rn $'[^\t -~]' \
              --include='*.cpp' --include='*.h' --include='*.qml' \
              --include='*.cmake' --include='*.cmake.in' --include='CMake*.txt' --include='*.yml' \
              QMdmm/QMdmm* QMdmm/cmake QMdmm/CMake*.txt QMdmm/.github QMdmm/3rdparty ; then
            echo "::error:: non-ASCII characters found in source files (see above)"
            exit 1
          fi

  build:
    name: Build & test (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, macos-26-intel]
        build_type: [Debug, Release, MinSizeRel]
        #
        # The cell that carries the coverage report is named here, in the
        # matrix, rather than in the condition on the step that generates it.
        # The condition used to spell out both literals, and a step that does
        # not run is a skip: renaming or retiring that runner would have
        # stopped the report publishing without anything going red. With the
        # cell named here, the same edit that moves the cell also moves the
        # coverage report.
        include:
          - os: ubuntu-latest
            build_type: Debug
            coverage: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: QMdmm

      - name: Set timezone (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          date

      - name: Set timezone (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo systemsetup -settimezone Asia/Shanghai ||
            sudo ln -sf /var/db/timezone/zoneinfo/Asia/Shanghai /etc/localtime
          date

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-websockets-dev qt6-declarative-dev qt6-tools-dev

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake_args=(-B build -S QMdmm -G "Unix Makefiles"
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -DBUILD_TESTING=ON
            -DQMDMM_EXPORT_PRIVATE=NO)
          if [ -n "${CMAKE_PREFIX_PATH:-}" ]; then
            cmake_args+=(-DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH")
          fi
          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          # Every case carries its own bound (see the test CMakeLists files), and the bound is
          # printed before the run: a case that has to be killed says which number it ran
          # under, and a case that lost its bound shows up here as "no bound" rather than as a
          # hang that eats the job's budget. --timeout below is the second half of the same
          # guard: it is the longest bound any case has -- the logic suite's, set from its
          # slowest cell -- so a case that goes without one still cannot outlast the
          # longest-bounded case. Raise it whenever that bound moves.
          ctest --test-dir build --show-only=json-v1 | python3 -c '
          import json, sys
          for case in json.load(sys.stdin)["tests"]:
              bound = next((p["value"] for p in case["properties"] if p["name"] == "TIMEOUT"), None)
              print("%s: TIMEOUT %s" % (case["name"], bound if bound else "not set"))
          '
          ctest --test-dir build --output-on-failure --timeout 1020

      - name: Test the system-wide configuration path
        run: |
          # The system scope of QSettings resolves under a directory that the configuration
          # prefix names, and that prefix is relative to the executable unless the install
          # prefix is /usr or / (see QMdmmCore::Global::configurationDirectory()). The
          # configure step passes no prefix, so the default /usr/local takes the relative
          # shape and the directory lands inside the build tree, which the runner user can
          # create and write. ctest reports a skip as "Passed" just as it does a pass, and
          # --output-on-failure keeps a passing test's output, so the test step above reads
          # green either way. Run that one test on its own and keep its output, which is
          # where a skip shows up; every other test still runs above.
          ctest --test-dir build -R 'tst_qmdmmsettings' -V > "${RUNNER_TEMP}/system-scope.log" 2>&1
          cat "${RUNNER_TEMP}/system-scope.log"

      - name: Check that the system-wide configuration case ran
        run: |
          # Ask for the case's PASS line rather than for the absence of a failure: a skip
          # is not a failure, so the latter would answer this the wrong way.
          if ! grep -q 'PASS   : tst_QMdmmSettings::globalConfigurationIsAnIniFileUnderSystemDirectory' "${RUNNER_TEMP}/system-scope.log"; then
            echo "::error::the system-wide configuration case did not run"
            exit 1
          fi

      - name: generate coverage
        if: ${{ github.event_name != 'pull_request' && matrix.coverage }}
        env:
          COVERAGE_TOKEN: ${{ secrets.QMDMM_DOCS_TOKEN }}
        run: |
          pip3 install gcovr
          mkdir -p build/coverage
          #
          # One home for the module list: it is both the --filter set and the
          # list the per-module check below asks for, so a module cannot be
          # added to one of them and forgotten in the other.
          modules=(QMdmmCore QMdmmNetworking QMdmmGui QMdmmServer QMdmmBot QMdmmCtl)
          filters=()
          for module in "${modules[@]}"; do
            filters+=(--filter "QMdmm/${module}/src/")
          done
          gcovr --root . "${filters[@]}" \
            --csv build/coverage.csv \
            --html-details build/coverage/index.html \
            --print-summary > build/coverage-summary.txt 2>&1
          cat build/coverage-summary.txt
          #
          # gcovr resolves --filter against the working directory, so a change of
          # layout can make every filter miss. It then only warns and still exits
          # 0, and this job publishes whatever it gets -- on 2026-09-22 the report
          # came out as "0 out of 0" while the run was green. Check that some lines
          # were measured before believing the reading.
          if ! grep -qE '^lines: .*out of [1-9][0-9]*\)' build/coverage-summary.txt; then
            echo "::error::the coverage filters matched nothing -- the report is empty"
            exit 1
          fi
          #
          # Losing a single module is not caught by the check above: the totals
          # stay non-empty and plausible. Measured on 2026-09-27 by misspelling
          # one filter -- the module disappeared, gcovr printed no warning at all
          # and the reading went from "82.5% (3648 out of 4424)" to
          # "83.1% (3431 out of 4131)", because the module that was lost was
          # below average. Ask for every module by name, using the CSV above.
          for module in "${modules[@]}"; do
            if ! grep -q "QMdmm/${module}/src/" build/coverage.csv; then
              echo "::error::the ${module} filter matched no files -- the report is missing a whole module"
              exit 1
            fi
          done
          grep '^lines: ' build/coverage-summary.txt
          git config --global user.name "`git -C QMdmm log -1 "--pretty=format:%an"`"
          git config --global user.email "`git -C QMdmm log -1 "--pretty=format:%ae"`"
          cd build/coverage
          touch .nojekyll
          git init -b main
          git add -A
          git commit -m "coverage: publish gcovr HTML report for ${{ github.sha }}"
          git remote add origin "https://x-access-token:${COVERAGE_TOKEN}@github.com/nemn9852/qmdmm-coverage.git"
          git push -f origin main

  sanitizers:
    name: Sanitizers (${{ matrix.os }}, Debug)
    #
    # AddressSanitizer and UndefinedBehaviorSanitizer over the same ctest set, in
    # a Debug cell per platform. It is a job of its own for the reason the tidy
    # job is one: these flags belong to this build only, and the build cells exist
    # to build the product as it ships.
    #
    # Two cells, because the two platforms reach Qt differently: Linux takes the
    # distribution's packages and macOS takes Homebrew's. The macOS cell is the
    # one that matters most -- AppleClang against a Homebrew Qt is where a
    # sanitizer build of this tree behaves least like an ordinary one -- and it is
    # a cell rather than a note because a run recorded once on somebody's machine
    # stops describing the tree the moment the tree moves.
    #
    # Nothing in here is continue-on-error. These cells exist in order to turn red
    # on a report, and a report is a defect in this tree rather than a probe that
    # may fail quietly: neither the distribution's Qt nor Homebrew's carries a
    # sanitizer, so every report below comes from this repository's own code or
    # from a header it instantiates.
    #
    # Leak detection is off. Whether storage is still reachable at exit is a
    # different question from whether it is used after it is gone -- the one these
    # cells ask -- and on a tree that shares its process with Qt's own statics it
    # needs a baseline to be read against; that baseline is the suppression list,
    # not this leg.
    #
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: QMdmm

      - name: Set timezone (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          date

      - name: Set timezone (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo systemsetup -settimezone Asia/Shanghai ||
            sudo ln -sf /var/db/timezone/zoneinfo/Asia/Shanghai /etc/localtime
          date

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-websockets-dev qt6-declarative-dev qt6-tools-dev

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Configure
        id: configure
        run: |
          # The flags go through CMAKE_CXX_FLAGS rather than through a build type
          # of their own because CMake passes them to the link line as well, which
          # is how the sanitizer runtimes reach the executables.
          cmake_args=(-B build -S QMdmm -G "Unix Makefiles"
            -DCMAKE_BUILD_TYPE=Debug
            -DBUILD_TESTING=ON
            -DQMDMM_EXPORT_PRIVATE=NO
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer")
          if [ -n "${CMAKE_PREFIX_PATH:-}" ]; then
            cmake_args+=(-DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH")
          fi
          cmake "${cmake_args[@]}"

      - name: Build
        id: build
        run: cmake --build build --parallel

      - name: Test
        id: test
        env:
          # Leak detection stays off: this leg answers whether the tree reads or
          # writes memory it should not, not whether it leaks. Turning it on
          # would first need a suppression baseline for the Qt noise it reports,
          # so until that exists a green here says nothing about leaks.
          ASAN_OPTIONS: detect_leaks=0
          # halt_on_error is what makes a UBSan reading a failure. Without it the
          # runtime prints the diagnostic, the process carries on and the case
          # still passes, which is a green that says nothing. print_stacktrace is
          # there so the report names the line that did it.
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          # The log is kept because the step below counts what is in it, and
          # --output-on-failure is what puts the sanitizer's own report into it.
          # The bound is the same second half the ubuntu and macOS build cells use; the
          # windows cell passes none, so there the per-case bounds are the only ones.
          set -o pipefail
          ctest --test-dir build --output-on-failure --timeout 1020 2>&1 |
            tee "${RUNNER_TEMP}/sanitizers.log"

      - name: Report the reading
        if: always()
        run: |
          # One line, in the shape the windows cell uses: which of the three steps
          # carried out, how many cases ran, and what came back -- the sanitizer
          # reports by name, and the cases that failed. A red cell says that
          # something failed; it does not say whether the tree has a memory error
          # or whether one case merely failed, and telling those apart is the whole
          # reason this leg exists.
          log="${RUNNER_TEMP}/sanitizers.log"
          address=0
          undefined=0
          total=0
          failed=0
          names=none
          if [ -f "$log" ]; then
            address=$(grep -c 'ERROR: AddressSanitizer' "$log" || true)
            undefined=$(grep -c 'runtime error:' "$log" || true)
            summary=$(grep -E '^[0-9]+% tests passed' "$log" | tail -1 || true)
            total=$(printf '%s' "$summary" | sed -n 's/.*out of \([0-9][0-9]*\).*$/\1/p')
            failed=$(printf '%s' "$summary" | sed -n 's/.*, \([0-9][0-9]*\) tests failed.*/\1/p')
            total=${total:-0}
            failed=${failed:-0}
            names=$(awk '/^The following tests FAILED:/ { inside = 1; next }
                         inside && /^[[:space:]]+[0-9]+ - / { print; next }
                         inside { exit }' "$log" |
              sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*(.*$//' |
              paste -sd ';' - || true)
            if [ -n "$names" ]; then names="(${names})"; else names=none; fi
          fi
          echo "reading: configure=${{ steps.configure.outcome }} build=${{ steps.build.outcome }} test=${{ steps.test.outcome }} cases=$((total - failed))/${total} failed=${failed} ${names} address-reports=${address} undefined-reports=${undefined}"

  thread-sanitizer:
    name: ThreadSanitizer (ubuntu-latest probe, Debug)
    #
    # ThreadSanitizer over nearly the same ctest set, in a Debug cell on Linux.
    #
    # A probe, and allowed to be red, for the reason the sanitizer cells are not
    # probes and are not: a report from AddressSanitizer or UndefinedBehaviorSanitizer
    # is a defect in this tree, while a report from ThreadSanitizer has to be read
    # before it can be called one. Neither Qt flavour the cells install is built
    # with a sanitizer, and the runtime only sees the primitives it intercepts, so
    # the first question this leg has to answer is whether its own baseline is
    # usable at all. A gate built on an unread baseline would be a red nobody can
    # act on; the name says probe and continue-on-error keeps the run green.
    #
    # One cell, on Linux, for the reason the fuzz cell has one: the concurrency
    # this leg is about is in this repository's own code, not in the platform.
    # What it is about is one boundary -- the logic thread in LogicRunnerP against
    # the rest, which is otherwise a single-threaded event loop.
    #
    # halt_on_error=0 keeps a report from deciding a case: what a case did is the
    # "cases" reading, and what the runtime found is the "thread-reports" one.
    # exitcode=0 is not set beside it, and is set nowhere in this cell: it reads
    # as if it only kept the process's status out of the reading, but on one tree
    # over one suite "halt_on_error=0" alone came back with 214 reports and
    # "halt_on_error=0:exitcode=0" with none at all -- it stops the runtime from
    # printing, and a leg that cannot print has no reading.
    #
    # What that costs is accepted rather than worked around. A suite that
    # reported anything aborts on its way out, so ctest counts the suite failed
    # while the cases inside it ran and passed: on macOS, 4 of the 16 suites end
    # that way, and all 502 cases the 14 QtTest suites hold pass. exitcode does
    # not enter into it: the same tree and the same suite die of SIGABRT with the
    # option unset and with exitcode=66 alike, so pinning it would only suggest a
    # knob exists. The reading counts the two units apart instead -- "cases"
    # summed from each suite's own "Totals:" line, "suites" from ctest's summary.
    #
    # No suppression list, and deliberately not an empty one either. A list is
    # worth keeping only once someone has read what it would cover, and what
    # this one would cover is a reading of how the tests wait, not the density
    # of races in the tree. One reading of one tree -- macOS, the options
    # below, the test step at --output-on-failure as it stood in d73b560, over
    # the 16 suites this leg keeps: 344 reports in 29 distinct summaries -- 33
    # of them at five sites in this repository
    # (ServerConnectionP::sendRockPaperScissorsNotified 14,
    # sendActionOrderRequested 8, sendUpgradeNotified 1,
    # Logic::actionOrderReply 6, LogicP::upgradeFeasible 4), the other 311
    # inside Qt's container headers (QArrayDataPointer, QHash, QList,
    # qHashEquals). The same sources read back in 2ae3b25, once the test step
    # had moved to -V, came to 349 reports, so neither number is a constant:
    # they are two readings of one tree, and both are on macOS. Reading the
    # stacks rather than the counts is what says so:
    # the write side builds a payload on the logic thread while the read side
    # takes a name off it on another, and both sides carry the same allocation.
    # The hand-off is ordered, and what is missing is the runtime's view of that
    # edge rather than the edge itself -- a probe outside this tree, with the
    # same hand-off and the same Qt, reports nothing over 50 rounds under
    # QCoreApplication::exec(), and reports the identical
    # "qarraydatapointer.h:112 in QArrayDataPointer<char16_t>::data()" as soon
    # as the reading side is pumped by a nested QEventLoop with a
    # QTimer::singleShot, which is the shape QTest::qWait has. A plain int
    # written once and read once on the same path reports under that loop too.
    # So the count is the test's event loop made visible, not a defect: no site
    # here is a race to repair, and a list keyed on those headers would encode
    # today's pump as noise. That holds for the stacks read above, on macOS, and
    # does not carry over -- this cell runs on Linux, where one run of it, read
    # on 2026-10-25, came to 13061 reports with all 16 suites red, and nobody
    # has read those stacks yet. Those counts are a reading of one tree on one
    # platform, not a promise, and the cell below prints its own.
    #
    # Two suites are left out, and the positive control is a third. Both excluded
    # suites drive other programs built with the same flags, and both stop at a
    # bound of their own rather than at a bound this leg could lengthen:
    # "QMdmmServer - server cli - Qt6" has TIMEOUT 60 for a suite that takes 107 s
    # instrumented, and "QMdmmBot - headless game - Qt6" waits 120 s for a match
    # that takes longer (measured on macOS, where the whole set goes from 150 s to
    # 596 s). Those numbers are the cost of the flags, not a finding, and a cell
    # that reported them on every run would be the red nobody can act on. What
    # they cover is the same code the cases kept here cover in process, and the
    # sanitizer cells still run them at native speed. The control is left out of
    # this run so that "thread-reports" keeps meaning what the tree does on its
    # own; the step above runs it on its own, under options that do print.
    #
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: QMdmm

      - name: Set timezone (Linux)
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          date

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-websockets-dev qt6-declarative-dev qt6-tools-dev

      - name: Configure
        id: configure
        run: |
          # The flags go through CMAKE_CXX_FLAGS rather than through a build type
          # of their own for the reason the sanitizer cells give: CMake passes them
          # to the link line as well, which is how the runtime reaches the
          # executables. They also have to reach every translation unit, not just
          # the one under test -- a race whose two halves are instrumented
          # differently is not a race the runtime can see.
          cmake -B build -S QMdmm -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DQMDMM_EXPORT_PRIVATE=NO \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"

      - name: Build
        id: build
        run: cmake --build build --parallel

      - name: Positive control
        id: control
        env:
          # The one case in the tree that must produce a report. It runs before
          # the set rather than after it, because a step that fails skips every
          # step after it: this is what makes a zero falsifiable, and a red test
          # run must not be the thing that takes it away. Its options are the
          # loose ones for the same reason -- exitcode=0 would silence the report
          # this step exists to see, and the suite would then pass for the wrong
          # reason.
          QMDMM_TSAN_CONTROL: 1
          TSAN_OPTIONS: halt_on_error=0
        run: |
          # The case is a data race, so the run is expected to fail: what is read
          # here is the log, not the exit status. A log with no report in it is
          # the failure this step is for -- it means the runtime says nothing
          # even when it is allowed to, and every zero this leg reports is then
          # unreadable.
          log="${RUNNER_TEMP}/tsan-control.log"
          ctest --test-dir build --output-on-failure --timeout 120 \
            -R '^QMdmmCore - tst_qmdmmrace.cpp - Qt6$' 2>&1 |
            tee "$log" || true
          if ! grep -q 'WARNING: ThreadSanitizer' "$log"; then
            echo "::error::the positive control raced without a report -- this leg cannot tell 'nothing raced' from 'the runtime said nothing'"
            exit 1
          fi
          grep -c 'WARNING: ThreadSanitizer' "$log"

      - name: Test
        id: test
        # Waits for the build, not for the control: a control that fails says the
        # runtime says nothing, and that is exactly the run whose own count is
        # worth having. Skipping on it would take away the reading the control
        # was sent to vouch for.
        if: ${{ steps.build.outcome == 'success' }}
        env:
          # A report must not decide a case: the case either did its work or it
          # did not, and the runtime's findings are counted separately below.
          # exitcode=0 is deliberately absent, for the reason the job's own
          # comment gives: it silences the runtime instead of only sparing the
          # process's status, and a silent leg has nothing to report.
          TSAN_OPTIONS: halt_on_error=0
        run: |
          # -V rather than --output-on-failure: the case count comes from the
          # "Totals:" line each QtTest suite prints about itself, and
          # --output-on-failure prints a suite's output only when it failed --
          # measured on one tree with two suites, one of them failing: a single
          # "Totals:" line reached the log. A count covering whichever suites
          # happened to fail is not a count. Verbose also prefixes each suite's
          # lines with that suite's number, which the count allows for. The log
          # is kept either way; -E drops the suites described above, the positive
          # control among them.
          set -o pipefail
          ctest --test-dir build -V --timeout 1020 \
            -E '^(QMdmmServer - server cli - Qt6|QMdmmBot - headless game - Qt6|QMdmmCore - tst_qmdmmrace.cpp - Qt6)$' 2>&1 |
            tee "${RUNNER_TEMP}/tsan.log"

      - name: Report the reading
        if: always()
        run: |
          # One line, in the shape the other legs use: which of the steps
          # carried out, how many cases ran, and what came back -- the reports by
          # count, the suites that failed by name, and the control's own count.
          # The counts are what this leg exists to produce; the step outcomes say
          # whether it got to produce them. The two counts are read together: a
          # zero in the first beside a non-zero in the second is the tree having
          # nothing to report on this run, because the control is what says the
          # runtime would have spoken if there had been something.
          #
          # "cases" counts cases and "suites" counts suites. Until this cell
          # reported a case count, both fields counted suites, and a run on which
          # every case passed read as 0/16. The case numbers come from the
          # "Totals:" line each QtTest suite prints about itself (under -V it
          # arrives prefixed with the suite's number), so a suite that is not
          # QtTest -- the two smoke suites -- adds nothing to either number; that
          # it was there is what the suite count says.
          log="${RUNNER_TEMP}/tsan.log"
          controlLog="${RUNNER_TEMP}/tsan-control.log"
          reports=0
          control=0
          casePassed=0
          caseRan=0
          total=0
          failed=0
          names=none
          if [ -f "$log" ]; then
            reports=$(grep -c 'WARNING: ThreadSanitizer' "$log" || true)
            summary=$(grep -E '^[0-9]+% tests passed' "$log" | tail -1 || true)
            total=$(printf '%s' "$summary" | sed -n 's/.*out of \([0-9][0-9]*\).*$/\1/p')
            failed=$(printf '%s' "$summary" | sed -n 's/.*, \([0-9][0-9]*\) tests failed.*/\1/p')
            total=${total:-0}
            failed=${failed:-0}
            cases=$(awk '/^([0-9]+: )?Totals: / {
                           for (i = 2; i < NF; i++) {
                             unit = $(i + 1)
                             sub(/,/, "", unit)
                             if (unit == "passed") passed += $i
                             else if (unit == "failed") failedCases += $i
                           }
                         }
                         END { printf "%d %d", passed + 0, failedCases + 0 }' "$log")
            casePassed=${cases% *}
            caseRan=$((casePassed + ${cases#* }))
            names=$(awk '/^The following tests FAILED:/ { inside = 1; next }
                         inside && /^[[:space:]]+[0-9]+ - / { print; next }
                         inside { exit }' "$log" |
              sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*(.*$//' |
              paste -sd ';' - || true)
            if [ -n "$names" ]; then names="(${names})"; else names=none; fi
          fi
          if [ -f "$controlLog" ]; then
            control=$(grep -c 'WARNING: ThreadSanitizer' "$controlLog" || true)
          fi
          echo "reading: configure=${{ steps.configure.outcome }} build=${{ steps.build.outcome }} control=${{ steps.control.outcome }} test=${{ steps.test.outcome }} cases=${casePassed}/${caseRan} suites=$((total - failed))/${total} ${names} thread-reports=${reports} positive-control=${control}"

  fuzz:
    name: Fuzz (ubuntu-latest, inbound decoding)
    #
    # A time-boxed libFuzzer run over the one decoder that reads bytes nobody in
    # this project wrote. Packet::fromJson() is what turns a peer's array into the
    # fields the rest of the program goes on to trust, and hand-written cases only
    # ever cover the shapes somebody thought of; this leg generates the rest.
    #
    # One cell, on Linux. Nothing in the harness reads the platform -- the decoder
    # is Qt-only code -- so a second cell would spend the same minutes to learn the
    # same thing. It is not a build cell either: turning the harness on instruments
    # the whole build, because the thing under test is library code (see
    # QMDMM_BUILD_FUZZ_TARGET in the top-level CMakeLists.txt), and that is not
    # what the build cells exist to produce.
    #
    # Nothing here is continue-on-error, for the reason the sanitizer cells are
    # not: a crash in this leg is a defect in this tree, and a gate whose red means
    # nothing is worse than no gate at all.
    #
    # The corpus under QMdmmCore/fuzz/corpus is both the seed set and the
    # regression set -- every run starts from it, so a shape that once broke the
    # decoder keeps being tried. What a run adds goes up as an artifact instead of
    # back into the tree: a job that committed would need a token and a push, and
    # the interesting half of a corpus is the part a person should read before it
    # lands.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: QMdmm

      - name: Set timezone (Linux)
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          date

      - name: Install Qt and clang
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang qt6-base-dev qt6-websockets-dev qt6-declarative-dev qt6-tools-dev
          # The fuzzer runtime ships apart from the compiler on Debian and Ubuntu.
          # Ask for the versionless package first so it matches whatever `clang`
          # resolved to, and fall back to the number the compiler itself reports
          # when the archive only carries numbered ones. Not a scan of package
          # names: that namespace also holds the wasm and windows cross runtimes
          # (libclang-rt-*-dev-wasm32, -dev-win, ...), and installing one of those
          # would leave the flag without a runtime this build can link. Which
          # branch was taken needs no check of its own -- the configure step asks
          # the toolchain the only question that matters and fails plainly when
          # the answer is no.
          sudo apt-get install -y libclang-rt-dev ||
            sudo apt-get install -y "libclang-rt-$(clang++ -dumpversion | cut -d. -f1)-dev"

      - name: Configure
        id: configure
        run: |
          # BUILD_TESTING stays off: the harness is not one of the cases, so none
          # of the test frameworks are needed for it.
          cmake -B build -S QMdmm -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=OFF \
            -DQMDMM_BUILD_FUZZ_TARGET=ON \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build the harness
        id: build
        run: cmake --build build --target QMdmm_fuzz_packet --parallel

      - name: Fuzz
        id: fuzz
        env:
          # Leak detection stays off, as in the sanitizer cells: this asks whether
          # the decoder mishandles what it is handed, not whether the process leaks
          # at exit, and Qt's own statics would need a suppression baseline first.
          ASAN_OPTIONS: detect_leaks=0
        run: |
          corpus="${RUNNER_TEMP}/corpus"
          mkdir -p "$corpus"
          cp QMdmm/QMdmmCore/fuzz/corpus/*.json "$corpus/"
          # The bound is on the whole run, not on one input: -max_total_time is the
          # budget, -timeout is the hang detector inside it (a decoder that stops
          # answering is a defect too, and without this it would hold the job until
          # GitHub's own limit). The binary follows CMAKE_RUNTIME_OUTPUT_DIRECTORY,
          # which is build/bin under the build tree rather than the generator's own.
          set -o pipefail
          ./build/build/bin/QMdmm_fuzz_packet \
            -max_total_time=60 -timeout=25 -print_final_stats=1 -rss_limit_mb=4096 \
            "$corpus" 2>&1 | tee "${RUNNER_TEMP}/fuzz.log"

      - name: Report the reading
        if: always()
        run: |
          # One line, in the shape the other legs use: which of the three steps
          # carried out, how many executions the run got through, and what came
          # back. A red cell says something failed; this line says whether it was
          # the toolchain, the build, or the decoder.
          log="${RUNNER_TEMP}/fuzz.log"
          runs=0
          crashes=0
          corpus=0
          if [ -f "$log" ]; then
            runs=$(sed -n 's/^stat::number_of_executed_units: *\([0-9][0-9]*\)$/\1/p' "$log" | tail -1)
            crashes=$(grep -cE 'AddressSanitizer: |runtime error:' "$log" || true)
            corpus=$(find "${RUNNER_TEMP}/corpus" -type f | wc -l | tr -d ' ')
          fi
          echo "reading: configure=${{ steps.configure.outcome }} build=${{ steps.build.outcome }} fuzz=${{ steps.fuzz.outcome }} runs=${runs:-0} crashes=${crashes:-0} corpus=${corpus:-0}"

      - name: Archive the corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: ${{ runner.temp }}/corpus
          if-no-files-found: warn

  build-windows:
    name: Build & test (windows-latest, ${{ matrix.build_type }})
    #
    # The one cell that builds and tests the tree with MSVC. The tree carried its
    # Windows branches for a long time -- CMakeLists.txt clears the shared-module
    # and shared-library prefixes and gives MSVC an .a import suffix, QMdmmCore
    # adds UNICODE and _UNICODE, QMdmmGui declares its executable WIN32 -- and
    # this job is where they are exercised; nothing else here builds them.
    #
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: QMdmm

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 6.12, the line the packaging workflows take, on the one backend that
          # can still reach it here. Qt split the Windows desktop package
          # folders per architecture from 6.11 on: the metadata used to sit one
          # level in (qt6_6103/qt6_6103/Updates.xml) and now sits one
          # architecture further down (qt6_6120/qt6_6120_msvc2022_64/
          # Updates.xml exists, while qt6_6120/qt6_6120 is a 404). The released
          # aqtinstall 3.3.0 -- this action's default backend -- still asks for
          # the old path, so Install Qt died with "Failed to locate XML data for
          # Qt version '6.12.0'"; 6.8, 6.9 and 6.10 resolve because their
          # folders kept the old shape.
          #
          # aqtsource pins the upstream commit that learned the new layout
          # (miurahr/aqtinstall#1000, reported through jurplel/install-qt-action
          # #374). It is a full commit and not a branch, so this runner stays
          # reproducible; revisit when Qt ships a newer release or aqtinstall
          # cuts one, whichever comes first.
          #
          # WebSockets, as everywhere else, is the one add-on module
          # QMdmmNetworking links against.
          version: '6.12.*'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          arch: win64_msvc2022_64
          modules: 'qtwebsockets'

      - name: Configure
        id: configure
        run: |
          # No -G: the default generator on a windows-latest runner is the
          # Visual Studio one, and naming a version here would be one more
          # literal to revisit whenever the image moves. That generator is
          # multi-config, so the build type is chosen on the build and test
          # steps rather than here; -A x64 matches the architecture of the Qt
          # archive installed above.
          cmake -B build -S QMdmm -A x64 \
            -DBUILD_TESTING=ON \
            -DQMDMM_EXPORT_PRIVATE=NO \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        id: build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        id: test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Show what the failing tests reported
        if: always()
        run: |
          # ctest --output-on-failure prints nothing at all for the cases that
          # fail here: the log runs straight from the ***Failed line to the next
          # test, so neither the case that failed nor what it compared is
          # anywhere in it. The reading is one level down instead -- every QtTest
          # entry is started with -o <name>6.xml,junitxml, and those reports carry
          # the case name and quote its message. The eleven binaries with a shared
          # test main get it from that main; the smoke runner, the server cli and
          # the two GUI binaries are given it by their own add_test.
          #
          # Two of the sixteen entries still write none -- the smoke runner's two,
          # whose main is a hand-written game loop rather than a QtTest one and so
          # takes no -o at all. The census below is over the fourteen that do, and
          # it is read as such rather than as a process that died before it could
          # write anything.
          shopt -s globstar nullglob
          reports=(build/**/*6.xml)
          failing=()
          for report in "${reports[@]}"; do
            if grep -q '<failure' "$report"; then
              failing+=("$report")
            fi
          done
          echo "junit reports under the build tree: ${#reports[@]}, of them failing: ${#failing[@]}"
          if (( ${#reports[@]} == 0 )); then
            echo "no junit report was written anywhere under build; what is there:"
            find build -name '*.xml' | head -20
          fi
          for report in "${failing[@]}"; do
            echo "=== $report"
            cat "$report"
          done

      - name: Re-run the failing tests verbosely
        if: failure() && steps.test.outcome == 'failure'
        run: |
          # The census in the step above leaves out the two entries whose main is not a
          # QtTest one -- the smoke runner's two -- so a failure in those has no report to
          # read. Re-running just the entries that failed, with -V, is what is left for
          # them: it prints ctest's own reading of each one (the command, the working
          # directory, the environment, the time it took). The tests' own output is not
          # expected here -- on this runner it reaches neither this log nor the census --
          # and it is not asked for. It costs the time of the tests that failed and only a
          # red cell pays it.
          #
          # failure() is not redundant here. A step condition that names no status function is
          # taken as success() && that condition, so on its own the comparison below never
          # held and this step was skipped in the run that added it, with steps.test.outcome
          # reading failure in the step after it.
          ctest --test-dir build -C ${{ matrix.build_type }} --rerun-failed -V

      - name: Report the reading
        if: always()
        run: |
          # One line saying which of the three steps carried out and which did
          # not. A red run says that something failed, not which of configure,
          # build and test it was, so the reading is taken from the log.
          echo "reading: configure=${{ steps.configure.outcome }} build=${{ steps.build.outcome }} test=${{ steps.test.outcome }}"

  docs:
    name: Publish API docs
    runs-on: macos-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: QMdmm

      - name: Set timezone (macOS)
        run: |
          sudo systemsetup -settimezone Asia/Shanghai ||
            sudo ln -sf /var/db/timezone/zoneinfo/Asia/Shanghai /etc/localtime
          date

      - name: Install doxygen
        run: brew install doxygen

      - name: Install Qt
        run: |
          brew install qt
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -B build -S QMdmm -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"

      - name: Build docs
        run: cmake --build build --target QMdmm_docs

      - name: Publish to qmdmm-docs
        env:
          DOCS_TOKEN: ${{ secrets.QMDMM_DOCS_TOKEN }}
        run: |
          git config --global user.name "`git -C QMdmm log -1 "--pretty=format:%an"`"
          git config --global user.email "`git -C QMdmm log -1 "--pretty=format:%ae"`"
          cd build/doc/html
          touch .nojekyll
          git init -b main
          git add -A
          git commit -m "docs: publish doxygen-generated API reference for ${{ github.sha }}"
          git remote add origin "https://x-access-token:${DOCS_TOKEN}@github.com/nemn9852/qmdmm-docs.git"
          git push -f origin main

  tidy:
    name: clang-tidy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        #
        # One cell per platform, so a finding that only one of the two
        # toolchains sees still turns the run red. This is a job of its own
        # rather than a step in `build`: the scan needs a compilation database
        # that carries no precompiled header, and the build cells exist to
        # build the product rather than to be reconfigured for the linter.
        #
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: QMdmm

      - name: Install clang-tidy and Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy qt6-base-dev qt6-websockets-dev qt6-declarative-dev qt6-tools-dev

      - name: Install clang-tidy and Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          # Xcode's command line tools carry no clang-tidy, so the scan uses
          # Homebrew's LLVM instead.
          brew install llvm qt
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          #
          # The database has to come out without a precompiled header in it: on
          # macOS the build uses Apple clang, whose PCH a Homebrew LLVM
          # clang-tidy cannot read, and a unit that dies on its header is
          # abandoned part-way through -- the warning count then says nothing
          # about the rest of the file. The header is an accelerator for the
          # compiler, not something the scan reads, so this job does without one.
          #
          cmake_args=(-B build -S QMdmm -G "Unix Makefiles"
            -DCMAKE_BUILD_TYPE=Debug
            -DBUILD_TESTING=ON
            -DQMDMM_EXPORT_PRIVATE=NO
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON)
          if [ -n "${CMAKE_PREFIX_PATH:-}" ]; then
            cmake_args+=(-DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH")
          fi
          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Run clang-tidy
        run: |
          #
          # The scan is anchored to the source tree by absolute path. The
          # database also holds the build directory's own generated units
          # (*_autogen/mocs_compilation.cpp): they have no .clang-tidy ancestor,
          # so each of them would fail with "no checks enabled" while the
          # warning count stayed at 0 -- a red that says nothing about the
          # sources, and a green that says nothing about the scan.
          #
          if [ "$RUNNER_OS" = "macOS" ]; then
            tidy_path="$(brew --prefix llvm)/bin:$PATH"
            tidy_args=(-extra-arg=-isysroot -extra-arg="$(xcrun --show-sdk-path)")
          else
            tidy_path="$PATH"
            tidy_args=()
          fi
          #
          # Say which toolchain is about to run. The two cells get clang-tidy
          # from different places -- the distribution's packages on Linux, a
          # Homebrew keg on macOS -- and a red run whose cause was exactly that
          # took a whole round to place, because nothing in the log said which
          # generation either cell had. The path is decided just above, so this
          # names the one the scan will really use; and it stays a reading
          # rather than a pin: the two cells together are what covers the check
          # families, so holding either of them to the other's version would
          # drop checks rather than add discipline.
          #
          PATH="$tidy_path" clang-tidy --version
          #
          # One home for the module list, as in the coverage step: the range
          # below is built from it, and the checks after the run walk the same
          # list, so a module cannot be named in one of them and forgotten in
          # the other.
          #
          modules=(QMdmmCore QMdmmNetworking QMdmmGui QMdmmServer QMdmmBot QMdmmCtl)
          joined=""
          for module in "${modules[@]}"; do
            joined="${joined:+$joined|}$module"
          done
          range="(${joined})/(src|test)/"
          log="${RUNNER_TEMP}/clang-tidy.log"
          cd QMdmm
          rc=0
          PATH="$tidy_path" run-clang-tidy -p "$PWD/../build" \
            -header-filter="^$PWD/$range.*" "${tidy_args[@]}" \
            -j "$(getconf _NPROCESSORS_ONLN)" "$PWD/$range" > "$log" 2>&1 || rc=$?
          cat "$log"
          #
          # Read how many units were scanned before believing the count, and
          # count the diagnostics with ': warning:' rather than '^warning:' --
          # the output is one concatenated stream and every diagnostic line
          # starts with a path, so the anchored form counts 0 whatever the tree
          # looks like.
          #
          grep -o '[0-9][0-9]* files out of [0-9][0-9]*' "$log" || true
          scanned=$(grep -oE '[0-9]+ files out of' "$log" | head -1 | grep -oE '[0-9]+' || true)
          warnings=$(grep -cE ': warning:' "$log" || true)
          errors=$(grep -cE ': error:' "$log" || true)
          nochecks=$(grep -c 'no checks enabled' "$log" || true)
          echo "clang-tidy: $warnings warning(s), $errors error(s), $nochecks unit(s) with no checks enabled, exit $rc"
          if [ "${scanned:-0}" -eq 0 ]; then
            echo "::error::clang-tidy reported no file range -- nothing was scanned"
            exit 1
          fi
          #
          # Losing a module is not caught by the count above: the scan stays
          # plausible and merely covers less, and the number it prints is one
          # nothing compares with the tree. On 2026-10-11 the range and the tree
          # agreed on 51 units, and run-clang-tidy prints one progress line per
          # unit -- ending it with the unit's path -- so ask for every module by
          # name, and for the tree's own count.
          #
          expected=$(git ls-files | grep -cE '/(src|test)/.*\.cpp$' || true)
          for module in "${modules[@]}"; do
            want=$(git ls-files "$module/src/*.cpp" "$module/test/*.cpp" | wc -l | tr -d ' ')
            got=$(grep -oE '[^[:space:]]*\.cpp$' "$log" | grep -cE "/$module/" || true)
            echo "clang-tidy: ${module}: ${got} of ${want} unit(s) scanned"
            if [ "$want" -gt 0 ] && [ "$got" -eq 0 ]; then
              echo "::error::clang-tidy scanned nothing under ${module} -- the range no longer covers it"
              exit 1
            fi
          done
          if [ "$scanned" -ne "$expected" ]; then
            echo "::error::clang-tidy scanned ${scanned} unit(s) where the tree holds ${expected} under (src|test) -- the range and the tree no longer agree"
            exit 1
          fi
          if [ "$warnings" -ne 0 ] || [ "$errors" -ne 0 ] || [ "$nochecks" -ne 0 ] || [ "$rc" -ne 0 ]; then
            echo "::error::clang-tidy did not come back clean (see the log above)"
            exit 1
          fi
